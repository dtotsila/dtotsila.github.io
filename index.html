<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            content="sSYGKkNVerRz9-Q-mkri_MzdxyhAE-8yBGXOEYWGAoU">
    <title>Dionis Totsila - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/socials.css">
    <script src="https://kit.fontawesome.com/ef70d6365d.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
        <a href="resume.html">Resume</a>
    </nav>
    <main>
        <div class="container">
            <header>
                <h2>Prompt</h2>
                <div class="system-prompt">
                    You are a biographer. Introduce Dionis Totsila in a short paragraph.
                </div>
                </header>

            <div id="home-content">
                <!-- Image container -->
                <div id="image-container">
                    <div id="generating-image-message">
                        <p class="glowing-text">Generating image...</p>
                    </div>
                    <img id="profile-image" src="your-image.jpg" alt="Dionis Totsila" />
                </div>
                <h2>Response</h2>
                <p id="dynamic-response">Generating content...</p>
            </div>

        </div>
        <div class="social-media-container show-social-media">
            <a href="https://www.linkedin.com/in/dionis-totsila/" class="social-media-button linkedin button
                button--sacnite button--round-l" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-solid fa-linkedin" title="Linked-in" aria-hidden="true"></i><span class="sr-only">Linked-in</span>
            </a>
            <a href="https://twitter.com/dionistotsila" class="social-media-button twitter button
                button--sacnite button--round-l" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-x-twitter" title="Twitter" aria-hidden="true"></i><span class="sr-only">Twitter</span>
            </a>
            <a href="https://github.com/dtotsila" class="social-media-button
                github button
                button--sacnite button--round-l" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-solid fa-github" title="Github" aria-hidden="true"></i><span class="sr-only">Github</span>
            </a>
            <a href="https://t.me/dtotsila" class="social-media-button
                github button
                button--sacnite button--round-l" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-solid fa-telegram" title="Telegram" aria-hidden="true"></i><span class="sr-only">Telegram</span>
            </a>

            <!-- insert email -->
            <a href="mailto:dionis.totsila@inria.fr" class="social-media-button
                button--sacnite button--round-l" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-solid fa-envelope" title="Email" aria-hidden="true"></i><span class="sr-only">Email</span>


        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Generate dynamic content for the home page
        generateDynamicResponse('home-content');
        // Generate the image dynamically after a delay
        setTimeout(loadProfileImage, 1500);
    </script>
